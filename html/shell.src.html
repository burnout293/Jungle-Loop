<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<!-- Jungle Loop's page (0.50): the game's canvas, and over it while the game loads a little chase drawn
     with the game's own pictures, one of four at random: they come in from the left, run on the spot while
     it loads, run off to the right when the home screen is ready, then the page fades onto it.
     0.51: on black, nothing but the runners (the least to load).
     0.52: it never freezes. Everything that moves is a CSS animation of `transform` or `opacity` only (the
     legs: each sheet slides behind a window, steps() picking the frames; the group: in, then out), which the
     browser plays on its compositor, apart from the page's JavaScript: while the engine is being compiled and
     started (seconds of JavaScript that hold everything else), the runners keep running. The chase is set up
     before the engine's script is even read.
     Source of html/shell.html: python html/make_shell.py (the pictures are put inside it). -->
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #fff8e6; background-color: #000; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#jl-load { position: fixed; inset: 0; z-index: 10; overflow: hidden; background: #000; transition: opacity .6s ease; will-change: opacity; }
#jl-load.gone { opacity: 0; pointer-events: none; }
#jl-group { position: absolute; left: 0; top: 0; will-change: transform; transform: translate3d(-200vw, 0, 0); }
.jl-win { position: absolute; overflow: hidden; }
.jl-strip { position: absolute; left: 0; top: 0; max-width: none; image-rendering: pixelated; will-change: transform; animation-timing-function: steps(var(--n)); animation-iteration-count: infinite; }
.jl-flame { position: absolute; border-radius: 50%; background: #ffb13b; box-shadow: 0 0 6px 2px #ff7a2a; will-change: transform, opacity; animation: jl-flick .12s steps(2) infinite; }
@keyframes jl-flick { from { transform: scale(1); opacity: 1; } to { transform: scale(.6); opacity: .7; } }
#status-notice { display: none; position: absolute; left: 2rem; right: 2rem; top: 40%; z-index: 11; background: #5b3943; border: 1px solid #9b3943; border-radius: .5rem; color: #e0e0e0; font-family: sans-serif; line-height: 1.3; padding: 1rem; text-align: center; }
</style>
<style id="jl-keys"></style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Ton navigateur ne sait pas afficher le jeu.</canvas>
<noscript>Le jeu a besoin de JavaScript.</noscript>
<div id="jl-load" aria-label="Chargement de Jungle Loop">
	<div id="jl-group"></div>
</div>
<div id="status-notice"></div>
<script>
// ---- the chase, before the engine's script (sizes in the game's art pixels: the game is 320 of them high) ----
(function () {
	const SHEETS = {
		hero: { src: '{{HERO}}', w: {{HERO_W}}, h: {{HERO_H}}, n: 8, d: .46, k: 1 / 3 },   // drawn by the game at 3 pixels per art pixel
		spear: { src: '{{SPEAR}}', w: 64, h: 64, n: 8, d: .62, k: .8 },                // as the game shows the pygmies (0.8)
		club: { src: '{{CLUB}}', w: 64, h: 64, n: 8, d: .62, k: .8 },
		gorilla: { src: '{{GORILLA}}', w: 104, h: 64, n: 4, d: .42, k: 1 },
		rhino: { src: '{{RHINO}}', w: 100, h: 61, n: 4, d: .4, k: 1 },
		missile: { src: '{{MISSILE}}', w: 46, h: 19, n: 1, d: 1, k: 1, flip: true },
	};
	// left to right, all running to the right: the one chased in front
	const SCENES = [
		[['spear', 0], ['club', 40], ['hero', 112]],                                    // Pépito, the pygmies after him
		[['missile', 0, 34], ['spear', 74], ['club', 112], ['hero', 182]],             // all of them, a missile after them
		[['spear', 0], ['gorilla', 60]],                                                 // a pygmy after the gorilla
		[['rhino', 0], ['club', 118], ['spear', 158]],                                   // the rhino after two pygmies
	];
	const ENTER = 1.3, EXIT = .95;                          // seconds: in from the left edge, out by the right one
	const load = document.getElementById('jl-load');
	const group = document.getElementById('jl-group');
	const keys = document.getElementById('jl-keys');
	// to try it: ?chase=1 to 4 picks the scene, ?lent=5 keeps them running on the spot 5 seconds at least
	const ask = new URLSearchParams(location.search);
	const pick = parseInt(ask.get('chase') || '', 10);
	const scene = SCENES[pick >= 1 && pick <= SCENES.length ? pick - 1 : Math.floor(Math.random() * SCENES.length)];
	const hold = Math.min(30, Math.max(.25, parseFloat(ask.get('lent') || '') || .25));
	const t0 = performance.now();
	let ready = false, leaving = false, mid = 0, out = 0;

	// the pictures, the frames' keyframes and the group's: all in pixels of this window, worked out once (again
	// if the window changes size, which only happens on purpose)
	function build() {
		const s = window.innerHeight / 320;
		group.innerHTML = '';
		let css = '', gw = 0;
		scene.forEach(([name, at, lift], i) => {
			const S = SHEETS[name];
			const w = Math.round(S.w * S.k * s), h = Math.round(S.h * S.k * s);
			const win = document.createElement('div');
			win.className = 'jl-win';
			win.style.cssText = 'width:' + w + 'px;height:' + h + 'px;left:' + Math.round(at * s) + 'px;bottom:' + Math.round((lift || 0) * s) + 'px' + (S.flip ? ';transform:scaleX(-1)' : '');
			const strip = document.createElement('img');
			strip.className = 'jl-strip';
			strip.alt = '';
			strip.src = S.src;
			strip.style.width = (w * S.n) + 'px';
			strip.style.height = h + 'px';
			if (S.n > 1) {
				strip.style.setProperty('--n', S.n);
				strip.style.animationName = 'jl-run' + i;
				strip.style.animationDuration = S.d + 's';
				css += '@keyframes jl-run' + i + '{from{transform:translate3d(0,0,0)}to{transform:translate3d(' + (-w * S.n) + 'px,0,0)}}';
			}
			win.appendChild(strip);
			group.appendChild(win);
			if (name === 'missile') {                       // its flame, behind it (on the left once turned)
				for (let f = 0; f < 3; f++) {
					const fl = document.createElement('div');
					fl.className = 'jl-flame';
					const r = (5 - f * 1.4) * s;
					fl.style.cssText = 'width:' + r + 'px;height:' + r + 'px;left:' + (at * s - r * (0.6 + f * 1.1)) + 'px;bottom:' + (((lift || 0) + 9.5) * s - r / 2) + 'px;animation-delay:' + (f * .04) + 's';
					group.appendChild(fl);
				}
			}
			gw = Math.max(gw, at * s + w);
		});
		const floor = Math.round(210 * s);                  // a little below the middle (no floor drawn)
		group.style.height = floor + 'px';
		group.style.width = gw + 'px';
		const from = -gw - 10 * s;
		mid = Math.round((window.innerWidth - gw) / 2);
		out = Math.round(window.innerWidth + 20 * s);
		css += '@keyframes jl-in{from{transform:translate3d(' + from + 'px,0,0)}to{transform:translate3d(' + mid + 'px,0,0)}}';
		css += '@keyframes jl-out{from{transform:translate3d(' + mid + 'px,0,0)}to{transform:translate3d(' + out + 'px,0,0)}}';
		keys.textContent = css;
		if (!leaving) {
			group.style.animation = 'none';
			void group.offsetWidth;                         // (restarts it in this window's sizes)
			const done = Math.min(ENTER, (performance.now() - t0) / 1000);
			group.style.animation = 'jl-in ' + ENTER + 's cubic-bezier(.33,1,.68,1) ' + (-done) + 's forwards';
		}
	}

	// off to the right once the home screen is up, they have run on the spot `hold` seconds and are in the middle
	function leave() {
		if (leaving) return;
		const wait = Math.max(0, (t0 + (ENTER + hold) * 1000) - performance.now());
		if (wait > 0) { setTimeout(leave, wait); return; }
		leaving = true;
		group.style.animation = 'jl-out ' + EXIT + 's cubic-bezier(.32,0,.67,0) forwards';
		setTimeout(() => {
			load.classList.add('gone');
			setTimeout(() => load.remove(), 650);
		}, EXIT * 1000);
	}

	build();
	window.addEventListener('resize', () => { if (!leaving) build(); });
	// the game says when its home screen is up (main.gd: window.jlReady); after the engine has started,
	// eight seconds at most
	window.jlReady = function () { ready = true; leave(); };
	window.jlStarted = function () { setTimeout(window.jlReady, 8000); };
}());
</script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const notice = document.getElementById('status-notice');
	function fail(err) {
		console.error(err);
		notice.textContent = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Une erreur inconnue est survenue.');
		notice.style.display = 'block';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let reg;
			try { reg = navigator.serviceWorker.getRegistration(); } catch (err) { reg = Promise.reject(new Error('Service worker registration failed.')); }
			Promise.race([
				reg.then((r) => { if (r != null) return Promise.reject(new Error('Service worker already exists.')); return r; }).then(() => engine.installServiceWorker()),
				new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
			]).then(() => { window.location.reload(); }).catch((err) => { console.error('Error while registering service worker:', err); });
		} else {
			fail('Ce navigateur ne peut pas lancer le jeu. Il manque :\n' + missing.join('\n'));
		}
	} else {
		engine.startGame().then(() => window.jlStarted(), fail);
	}
}());
</script>
</body>
</html>
