<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Loop — transitions de décor</title>
<style>
  body { margin: 0; padding: 20px; background: #0a0f14; color: #e8ecf4; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #ffd35c; }
  p { margin: 0 0 16px; color: #9fb0c4; max-width: 70ch; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #151b2c; border: 2px solid #2a3350; padding: 10px; }
  canvas { width: 100%; display: block; image-rendering: pixelated; background: #000; }
  figcaption { margin-top: 8px; }
  figcaption b { color: #5cf2e0; }
  figcaption span { display: block; color: #9fb0c4; font-size: 13px; }
</style>
</head>
<body>
<h1>Transitions de décor — 5 idées</h1>
<p>Chaque vignette rejoue en boucle le passage d'un décor au suivant (jungle, ruines, cité, donjon), à la vitesse du jeu en milieu de course. Donne-moi le numéro retenu, ou un mélange.</p>
<main id="grid"></main>
<script>
// A mock-up, not the game: each idea is one way of putting scenery B over scenery A, given where
// the border between them is on screen (it scrolls in from the right with the world).
const W = 569, H = 320, GN = 280, SPEED = 300, LOOP = 6.5, ENTER = 1.6;
const DIR = '../assets/img/';
const BIOMES = [
  { bg: 'bg-far', mid: 'mid', ground: 'ground-1', glow: '#7bd13c' },
  { bg: 'ruins-bg', mid: 'ruins-mid', ground: 'ruins-ground', glow: '#ffb070' },
  { bg: 'city-bg', mid: 'city-mid', ground: 'city-ground', glow: '#3fd9e6' },
  { bg: 'dungeon-bg', mid: 'dungeon-mid', ground: 'dungeon-ground', glow: '#9a8cff' },
];
const IMG = {};
const load = (n) => new Promise((ok) => { const im = new Image(); im.onload = () => { IMG[n] = im; ok(); }; im.onerror = ok; im.src = DIR + n + '.png'; });
const h01 = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

function strip(c, im, off, y) {
  if (!im) return;
  for (let i = Math.floor(off / im.width); i * im.width - off < W; i++) {
    const x = Math.round(i * im.width - off);
    if (i & 1) { c.save(); c.translate(x + im.width, y); c.scale(-1, 1); c.drawImage(im, 0, 0); c.restore(); } else c.drawImage(im, x, y);
  }
}
function scene(c, b, cam) {
  c.clearRect(0, 0, W, H);
  strip(c, IMG[b.bg], cam * 0.18, H - IMG[b.bg].height);
  strip(c, IMG[b.mid], cam * 0.5, GN + 20 - IMG[b.mid].height);
  strip(c, IMG[b.ground], cam, GN - 4);
}
function hero(c, t) {
  const b = IMG['hero-body']; if (!b) return;
  c.drawImage(b, 76, GN - 50 + Math.round(Math.abs(Math.sin(t * 11)) * 2));
  c.drawImage(IMG['hero-shoe'], 92 + Math.round(Math.cos(t * 11) * 7), GN - 9); c.drawImage(IMG['hero-shoe'], 92 - Math.round(Math.cos(t * 11) * 7), GN - 9);
}

// Each idea: paint(ctx, A, B, e, t) with A and B the two sceneries already drawn on spare canvases,
// e the border's screen x, t the seconds since the loop began.
const IDEAS = [
  { name: '1 · Fondu (actuelle)', text: 'Le nouveau décor apparaît en fondu sur une large bande. Discret, mais on ne « sent » pas le passage.',
    paint(c, A, B, e) {
      c.drawImage(A, 0, 0);
      const s = spare.getContext('2d'); s.globalCompositeOperation = 'source-over'; s.clearRect(0, 0, W, H); s.drawImage(B, 0, 0);
      const g = s.createLinearGradient(e - 110, 0, e + 110, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000');
      s.globalCompositeOperation = 'destination-in'; s.fillStyle = g; s.fillRect(0, 0, W, H);
      c.drawImage(spare, 0, 0);
    } },
  { name: '2 · Faille temporelle', text: 'La relique déchire le temps : une faille de lumière verticale balaie l\'écran, le nouveau décor est derrière. Colle à l\'histoire de la boucle.',
    paint(c, A, B, e, t) {
      c.drawImage(A, 0, 0);
      c.save(); c.beginPath(); c.moveTo(W, 0);
      for (let y = 0; y <= H; y += 8) c.lineTo(e + Math.sin(y * 0.11 + t * 9) * 7 + (h01(y, Math.floor(t * 14)) - 0.5) * 12, y);
      c.lineTo(W, H); c.closePath(); c.clip(); c.drawImage(B, 0, 0); c.restore();
      for (let k = 0; k < 7; k++) {                    // slices of the picture slipping sideways along the tear
        const y = Math.floor(h01(k, Math.floor(t * 12)) * H), hh = 3 + Math.floor(h01(k, 7 + Math.floor(t * 12)) * 9), dx = Math.round((h01(k, 3 + Math.floor(t * 12)) - 0.5) * 46);
        if (e > -40 && e < W + 40) c.drawImage(c.canvas, Math.max(0, e - 60), y, 120, hh, Math.max(0, e - 60) + dx, y, 120, hh);
      }
      const g = c.createLinearGradient(e - 26, 0, e + 26, 0);
      g.addColorStop(0, 'rgba(92,242,224,0)'); g.addColorStop(0.5, 'rgba(210,255,250,.95)'); g.addColorStop(1, 'rgba(92,242,224,0)');
      c.fillStyle = g; c.fillRect(e - 26, 0, 52, H);
      c.fillStyle = '#fff';
      for (let k = 0; k < 16; k++) { const y = (h01(k, 5) * H + t * (60 + k * 9)) % H; c.fillRect(Math.round(e + (h01(k, 9) - 0.5) * 60 - (t * 40 * h01(k, 2)) % 30), Math.round(y), 2, 2); }
    } },
  { name: '3 · Porte du temps', text: 'Une arche gravée se dresse sur la route. On la voit venir, on la traverse, un éclair : derrière, c\'est un autre monde. Fait un vrai repère tous les 400 m.',
    paint(c, A, B, e, t) {
      c.drawImage(A, 0, 0);
      c.save(); c.beginPath(); c.rect(e, 0, W + 900, H); c.clip(); c.drawImage(B, 0, 0); c.restore();
      const x = Math.round(e) - 13, pulse = 0.5 + 0.5 * Math.sin(t * 6);
      const g = c.createRadialGradient(e, 150, 4, e, 150, 90); g.addColorStop(0, `rgba(92,242,224,${0.35 + 0.2 * pulse})`); g.addColorStop(1, 'rgba(92,242,224,0)');
      c.fillStyle = g; c.fillRect(e - 90, 40, 180, 240);
      c.fillStyle = '#1a1024'; c.fillRect(x - 1, 20, 28, GN - 18); c.fillRect(x - 9, 14, 44, 16);
      for (let y = 22; y < GN; y += 14) for (let k = 0; k < 2; k++) { c.fillStyle = ['#6a6f8c', '#8a8fa8', '#4a4f6c', '#7a7f9a'][(y / 14 + k) % 4 | 0]; c.fillRect(x + k * 13 + (y / 14 & 1 ? 0 : 1), y, 12, 13); }
      c.fillStyle = '#8a8fa8'; c.fillRect(x - 8, 15, 42, 14); c.fillStyle = '#b9bdd2'; c.fillRect(x - 8, 15, 42, 2);
      c.fillStyle = `rgba(92,242,224,${0.6 + 0.4 * pulse})`;
      for (let y = 40; y < GN - 20; y += 34) { c.fillRect(x + 11, y, 4, 12); c.fillRect(x + 8, y + 4, 10, 4); }
      c.fillStyle = '#7bd13c'; c.fillRect(x - 6, 13, 12, 3); c.fillRect(x + 18, 28, 6, 8); c.fillRect(x + 2, 60, 3, 22);
      const d = Math.abs(e - 96); if (d < 60) { c.fillStyle = `rgba(220,255,250,${0.75 * (1 - d / 60)})`; c.fillRect(0, 0, W, H); }
    } },
  { name: '4 · Passage sombre', text: 'Un court boyau de roche avale l\'écran : une seconde dans le noir, on ne voit que le héros et les pièces, puis on débouche ailleurs. Aucun obstacle pendant le passage.',
    paint(c, A, B, e, t) {
      const L = 260;                                   // the passage's length, in pixels
      c.drawImage(A, 0, 0);
      c.save(); c.beginPath(); c.rect(e + L / 2, 0, W + 900, H); c.clip(); c.drawImage(B, 0, 0); c.restore();
      c.fillStyle = '#0b0914';
      c.beginPath(); c.moveTo(e, -2);
      for (let y = 0; y <= H; y += 10) c.lineTo(e - 14 - h01(y, 3) * 26, y);
      c.lineTo(e, H + 2); c.lineTo(e + L, H + 2);
      for (let y = H; y >= 0; y -= 10) c.lineTo(e + L + 14 + h01(y, 8) * 26, y);
      c.closePath(); c.fill();
      for (let k = 0; k < 9; k++) {                    // stalactites and their little brothers on the floor
        const x = e + 14 + k * 28 + h01(k, 4) * 12, len = 26 + h01(k, 6) * 54;
        c.fillStyle = '#231c36'; c.beginPath(); c.moveTo(x - 9, 0); c.lineTo(x + 9, 0); c.lineTo(x, len); c.fill();
        c.beginPath(); c.moveTo(x + 4, GN); c.lineTo(x + 20, GN); c.lineTo(x + 12, GN - len * 0.4); c.fill();
      }
      c.fillStyle = '#3a2f55'; c.fillRect(e, GN - 2, L, 3);
      for (let k = 0; k < 7; k++) { c.fillStyle = '#ffd35c'; c.fillRect(Math.round(e + 30 + k * 30), GN - 30, 6, 8); c.fillStyle = '#fff3a8'; c.fillRect(Math.round(e + 31 + k * 30), GN - 29, 2, 3); }
    } },
  { name: '5 · Mosaïque', text: 'Le décor se recompose carreau par carreau, comme une image qui se recharge. Très « jeu vidéo », rapide, sans rien ajouter sur la route.',
    paint(c, A, B, e) {
      c.drawImage(A, 0, 0);
      const S = 16;
      for (let y = 0; y < H; y += S) for (let x = 0; x < W; x += S) {
        const edge = e + (h01(x / S + 31 * (y / S), 2) - 0.5) * 240;
        if (x > edge) c.drawImage(B, x, y, S, S, x, y, S, S);
        else if (x > edge - 14) { c.fillStyle = 'rgba(210,255,250,.8)'; c.fillRect(x, y, S, S); }
      }
    } },
];

const spare = canvas(W, H);
(async () => {
  await Promise.all([...BIOMES.flatMap((b) => [b.bg, b.mid, b.ground]), 'hero-body', 'hero-shoe'].map(load));
  const A = canvas(W, H), B = canvas(W, H), views = [];
  for (const idea of IDEAS) {
    const f = document.createElement('figure'), cv = canvas(W, H), cap = document.createElement('figcaption');
    cap.innerHTML = `<b>${idea.name}</b><span>${idea.text}</span>`;
    f.append(cv, cap); document.getElementById('grid').append(f);
    views.push([idea, cv.getContext('2d')]);
  }
  for (const [, c] of views) c.imageSmoothingEnabled = false;
  const t0 = performance.now();
  (function frame(now) {
    const T = (now - t0) / 1000, n = Math.floor(T / LOOP), t = T % LOOP, cam = T * SPEED;
    const a = BIOMES[n % 4], b = BIOMES[(n + 1) % 4];
    scene(A.getContext('2d'), a, cam); scene(B.getContext('2d'), b, cam);
    const e = W + 170 - (t - ENTER) * SPEED;            // off screen to the right, then across, then off to the left
    for (const [idea, c] of views) {
      if (e > W + 160) c.drawImage(A, 0, 0); else if (e < -420) c.drawImage(B, 0, 0); else idea.paint(c, A, B, e, T);
      hero(c, T);
    }
    requestAnimationFrame(frame);
  })(t0);
})();
</script>
</body>
</html>
