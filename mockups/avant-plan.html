<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Loop — plantes d'avant-plan</title>
<style>
  body { margin: 0; padding: 20px; background: #0a0f14; color: #e8ecf4; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #ffd35c; }
  p { margin: 0 0 16px; color: #9fb0c4; max-width: 70ch; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #151b2c; border: 2px solid #2a3350; padding: 10px; }
  canvas { width: 100%; display: block; image-rendering: pixelated; background: #000; }
  figcaption { margin-top: 8px; } figcaption b { color: #5cf2e0; } figcaption span { display: block; color: #9fb0c4; font-size: 13px; }
</style>
</head>
<body>
<h1>Plantes d'avant-plan — 5 variantes</h1>
<p>Les feuilles qui passent devant l'image, en haut et en bas. Chaque vignette défile à la vitesse du jeu. Donne-moi la lettre retenue ; les silhouettes sont faites ici à partir des plantes du décor, je dessinerai de vraies planches pour la variante choisie.</p>
<main id="grid"></main>
<script>
const W = 569, H = 320, GN = 280, SPEED = 300, DIR = '../assets/img/';
const IMG = {};
const load = (n) => new Promise((ok) => { const im = new Image(); im.onload = () => { IMG[n] = im; ok(); }; im.onerror = ok; im.src = DIR + n + '.png'; });
const h01 = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function tinted(im, colour) { const c = canvas(im.width, im.height), x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = colour; x.fillRect(0, 0, c.width, c.height); return c; }
function strip(c, im, off, y) { for (let i = Math.floor(off / im.width); i * im.width - off < W; i++) { const x = Math.round(i * im.width - off); if (i & 1) { c.save(); c.translate(x + im.width, y); c.scale(-1, 1); c.drawImage(im, 0, 0); c.restore(); } else c.drawImage(im, x, y); } }
function sway(c, im, x, y, t, seed, amp) { for (let b = 0; b < im.height; b += 4) c.drawImage(im, 0, b, im.width, 4, x + Math.round(Math.sin(t * 1.7 + seed + b * 0.06) * amp * (1 - b / im.height) ** 1.5), y + b, im.width, 4); }

let SIL = [];                                          // plants of the scenery as dark shapes
// plants scattered along the bottom (and, upside down, the top), each `scale` times its size
function plants(c, cam, { gap, scale, top, colour = 0, par = 1.35 }) {
  const off = cam * par, first = Math.floor(off / gap) - 2;
  for (let i = first; i * gap - off < W + 80; i++) {
    if (h01(i, 3) < 0.15) continue;
    const im = SIL[colour][Math.floor(h01(i, 7) * SIL[colour].length)], s = scale * (0.8 + 0.5 * h01(i, 11));
    const x = Math.round(i * gap - off + h01(i, 5) * gap * 0.6), w = im.width * s, hh = im.height * s;
    c.drawImage(im, x, H - hh * 0.72, w, hh);
    if (top && h01(i, 13) > 0.45) { c.save(); c.translate(x + gap * 0.5, hh * 0.6); c.scale(1, -1); c.drawImage(im, 0, 0, w, hh); c.restore(); }
  }
}
const IDEAS = [
  { name: 'A · Actuel', text: 'Une seule bande de feuilles, en couleurs, qui se balance, en bas et en haut. Elle se répète et attire l\'œil.',
    paint(c, cam, t) { const im = IMG.fore; for (let i = Math.floor(cam * 1.35 / im.width); i * im.width - cam * 1.35 < W; i++) sway(c, im, Math.round(i * im.width - cam * 1.35), H - im.height + 26, t, 0, 2.5);
      c.save(); c.translate(0, 30); c.scale(1, -1); for (let i = Math.floor(cam * 1.2 / im.width); i * im.width - cam * 1.2 < W; i++) sway(c, im, Math.round(i * im.width - cam * 1.2), 0, t, 2, 2); c.restore(); } },
  { name: 'B · Silhouettes variées', text: 'Fougères, fleurs, champignons et troncs en ombres nettes, immobiles, de tailles différentes. Lisible : ce qui est noir ne fait jamais mal.',
    paint(c, cam) { plants(c, cam, { gap: 74, scale: 1.2, top: true }); } },
  { name: 'C · Silhouettes denses, deux profondeurs', text: 'Deux rangées d\'ombres : une bleutée plus lente derrière, une noire plus rapide devant. Donne de la vitesse et de l\'épaisseur à la jungle.',
    paint(c, cam) { plants(c, cam, { gap: 58, scale: 0.9, top: true, colour: 1, par: 1.15 }); plants(c, cam, { gap: 96, scale: 1.6, top: false, par: 1.6 }); } },
  { name: 'D · Bas seulement, clairsemé', text: 'Quelques grandes ombres en bas, rien en haut : le ciel et les singes restent dégagés, le HUD aussi.',
    paint(c, cam) { plants(c, cam, { gap: 150, scale: 1.9, top: false, par: 1.5 }); } },
  { name: 'E · Cadre fixe', text: 'Les feuilles ne défilent plus : elles encadrent l\'image comme une vignette, aux quatre coins. Rien ne passe devant la route.',
    paint(c) { const s = SIL[0];
      for (const [k, x, y, sc, fx, fy] of [[0, -30, H - 70, 2.2, 1, 1], [2, W - 120, H - 80, 2.3, -1, 1], [1, -20, 78, 2, 1, -1], [3, W - 110, 86, 2.1, -1, -1]]) {
        const im = s[k % s.length]; c.save(); c.translate(x + (fx < 0 ? im.width * sc : 0), y + (fy < 0 ? 0 : 0)); c.scale(fx * sc, fy * sc); c.drawImage(im, 0, fy < 0 ? -im.height : 0); c.restore(); } } },
];
(async () => {
  await Promise.all(['bg-far', 'mid', 'ground-1', 'fore', 'hero-body', 'spiky', 'coin', 'prop-0', 'prop-3', 'prop-4', 'prop-5', 'prop-6'].map(load));
  const src = ['prop-3', 'prop-4', 'prop-5', 'prop-0', 'prop-3'].map((n) => IMG[n]);
  SIL = [src.map((im) => tinted(im, '#0c0a1c')), src.map((im) => tinted(im, 'rgba(22,34,70,.92)'))];
  const views = IDEAS.map((idea) => { const f = document.createElement('figure'), cv = canvas(W, H), cap = document.createElement('figcaption'); cap.innerHTML = `<b>${idea.name}</b><span>${idea.text}</span>`; f.append(cv, cap); document.getElementById('grid').append(f); const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; return [idea, c]; });
  const t0 = performance.now();
  (function frame(now) {
    const t = (now - t0) / 1000, cam = t * SPEED;
    for (const [idea, c] of views) {
      strip(c, IMG['bg-far'], cam * 0.18, 0); strip(c, IMG.mid, cam * 0.5, GN + 20 - IMG.mid.height); strip(c, IMG['ground-1'], cam, GN - 4);
      for (let i = Math.floor(cam / 260); i * 260 - cam < W; i++) { const x = Math.round(i * 260 - cam); if (i % 2) c.drawImage(IMG.spiky, x, GN - 25); else for (let k = 0; k < 4; k++) c.drawImage(IMG.coin, 0, 0, 15, 16, x + k * 20, GN - 34, 15, 16); }
      c.drawImage(IMG['hero-body'], 76, GN - 46);
      idea.paint(c, cam, t);
    }
    requestAnimationFrame(frame);
  })(t0);
})();
</script>
</body>
</html>
