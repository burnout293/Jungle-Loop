<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Loop — entrée du temple</title>
<style>
  body { margin: 0; padding: 20px; background: #0a0f14; color: #e8ecf4; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #ffd35c; }
  p { margin: 0 0 16px; color: #9fb0c4; max-width: 70ch; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  figure { margin: 0; background: #151b2c; border: 2px solid #2a3350; padding: 10px; }
  canvas { width: 100%; display: block; image-rendering: pixelated; }
  figcaption { margin-top: 8px; }
  figcaption b { color: #5cf2e0; }
  figcaption span { display: block; color: #9fb0c4; font-size: 13px; }
</style>
</head>
<body>
<h1>Entrée du temple obstruée — 4 visuels</h1>
<p>Ce qu'on voit devant la porte pendant le grondement, avant l'explosion. Le premier est celui du jeu aujourd'hui, pour comparer. Les quatre autres sont dessinés dans la pierre et la mousse du temple.</p>
<main id="grid"></main>
<script>
const W = 200, H = 200, GN = 180, DIR = '../assets/img/';
const h01 = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
const IDEAS = [
  { name: '0 · Actuel', text: 'Des blocs gris dessinés par le programme : c\'est ce qui ne s\'intègre pas.' },
  { name: '1 · Éboulis', text: 'Un tas de gros blocs tombés, de la même pierre, mousse dans les fentes. Déborde un peu de la porte.', im: 'img/gravats-1.png' },
  { name: '2 · Dalle scellée', text: 'Une porte de pierre gravée, fendue : la lueur de la relique passe par la fissure. L\'explosion la fait voler en éclats.', im: 'img/gravats-2.png' },
  { name: '3 · Linteau effondré', text: 'Le linteau est tombé en travers de deux fûts de colonne. On devine le passage derrière.', im: 'img/gravats-3.png' },
  { name: '4 · Racines', text: 'Des rochers pris dans de grosses racines et des lianes : la jungle a refermé le temple.', im: 'img/gravats-4.png' },
];
(async () => {
  const temple = await load(DIR + 'temple.png'), bg = await load(DIR + 'bg-far.png'), ground = await load(DIR + 'ground-1.png');
  for (const idea of IDEAS) {
    const f = document.createElement('figure'), cv = document.createElement('canvas'), cap = document.createElement('figcaption');
    cv.width = W; cv.height = H; const c = cv.getContext('2d');
    c.drawImage(bg, 120, 100, W, H, 0, 0, W, H);
    c.drawImage(ground, 0, GN - 4); c.drawImage(ground, ground.width, GN - 4);
    const tx = 6, ty = GN - temple.height + 3;         // as in the game: the doorway is at x 84..126 of the temple
    c.drawImage(temple, tx, ty);
    if (idea.im) {
      const im = await load(idea.im);
      c.fillStyle = 'rgba(14,8,34,.3)'; c.fillRect(tx + 105 - im.width / 2, GN - 13, im.width, 2);
      c.drawImage(im, Math.round(tx + 105 - im.width / 2), GN - 14 - im.height);
    } else {
      for (let r = 0; r < 6; r++) for (let k = 0; k < 4; k++) {
        const w = 9 + Math.round(h01(r * 4 + k, 91) * 5), bx = tx + 82 + k * 11 + (r & 1 ? 4 : 0) + Math.round(h01(r * 4 + k, 93) * 3), by = GN - 14 - r * 11 - Math.round(h01(r * 4 + k, 95) * 3);
        c.fillStyle = '#1a1024'; c.fillRect(bx - 1, by - 1, w + 2, 12);
        c.fillStyle = ['#6a6f8c', '#8a8fa8', '#4a4f6c', '#7a7f9a'][(r + k) % 4]; c.fillRect(bx, by, w, 10);
        c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(bx, by, w, 2);
        if (h01(r * 4 + k, 97) > 0.7) { c.fillStyle = '#7bd13c'; c.fillRect(bx + 1, by - 1, 4, 2); }
      }
    }
    cap.innerHTML = `<b>${idea.name}</b><span>${idea.text}</span>`;
    f.append(cv, cap); document.getElementById('grid').append(f);
  }
})();
</script>
</body>
</html>
