<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Loop — essai de polices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@500;700&family=DotGothic16&family=Tiny5&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 18px 16px 60px; background: #10151c; color: #dfe7ee; font: 15px/1.5 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: #9fb0c0; margin: 0 0 16px; max-width: 75ch; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 14px; }
  .tabs button { padding: 6px 14px; border: 1px solid #33445a; border-radius: 99px; background: none; color: inherit; font: inherit; cursor: pointer; }
  .tabs button.on { background: #ffd35c; color: #2a2006; border-color: #ffd35c; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: 6px; }
  figcaption small { font-weight: 400; color: #9fb0c0; }
  iframe { width: 100%; aspect-ratio: 16 / 9; border: 1px solid #263242; display: block; background: #000; }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  td { padding: 8px 12px; border-bottom: 1px solid #263242; vertical-align: middle; }
  td:first-child { white-space: nowrap; color: #9fb0c0; width: 1%; }
  .big { font-size: calc(34px * var(--k)); color: #fff8e6; line-height: 1.1; letter-spacing: .02em; }
  .small { font-size: calc(17px * var(--k)); color: #ffd35c; line-height: 1.2; }
</style>
</head>
<body>
<h1>Jungle Loop — essai de polices</h1>
<p>En haut, les chiffres et quelques textes du jeu dans chaque police, ramenés à la même hauteur : c'est là que le 4 se juge. En dessous, le vrai jeu dans chaque police, sur la sauvegarde d'essai ; tu peux cliquer dedans. Dis-moi le numéro que tu retiens.</p>
<table id="specimen"></table>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<script>
// [name on Google Fonts, size correction, note]
const FONTS = [
  ['Press Start 2P', 0.62, 'arcade, très large'],
  ['VT323', 1.3, 'terminal, étroite'],
  ['Pixelify Sans', 1, 'pixel arrondie'],
  ['DotGothic16', 1.02, 'points fins, minuscules lisibles'],
  ['Tiny5', 1.1, 'minimaliste, 5 pixels de haut'],
  ['Silkscreen', 0.82, 'actuelle, tout en capitales'],
];
document.getElementById('specimen').innerHTML = FONTS.map(([name, fk, note], i) => `<tr style="font-family:'${name}';--k:${fk}">
  <td style="font-family:system-ui">${i + 1} · ${name}<br><small>${note}</small></td>
  <td><div class="big">0123456789</div><div class="small">1 844 M · +413 · 44 / 144</div></td>
  <td><div class="big">1866 M</div><div class="small">Niveau 14 · Saute 40 fois (24/40)</div></td></tr>`).join('');
// Only three live games at a time: six at once would be heavy.
const PAGES = [[0, 1, 2], [3, 4, 5]];
const tabs = document.getElementById('tabs'), grid = document.getElementById('grid');
function show(p) {
  [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === p));
  grid.innerHTML = PAGES[p].map((i) => {
    const [name, fk, note] = FONTS[i];
    return `<figure><figcaption>${i + 1} · ${name} <small>— ${note}</small></figcaption>
      <iframe src="../index.html?bac&font=${encodeURIComponent(name)}&fk=${fk}" loading="lazy"></iframe></figure>`;
  }).join('');
}
PAGES.forEach((_, p) => {
  const b = document.createElement('button');
  b.textContent = ['Le jeu en 1 à 3', 'Le jeu en 4 à 6'][p];
  b.onclick = () => show(p);
  tabs.append(b);
});
show(0);
</script>
</body>
</html>
